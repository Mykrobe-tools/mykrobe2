name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build command-line executable
        run: ./build.sh

      - name: Install Godot headless
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Check Godot project loads
        run: "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path gui --editor --quit"

      - name: Smoke-test Godot startup
        run: "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --path gui --quit-after 1"
